# Declared draft must stay 2020-12: the file uses `$defs` and `dependentRequired`,
# and jsonschema silently fell back to 2020-12 while this said draft-04 — which
# meant the draft-04 spelling of those keywords was being ignored outright.
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "http://schemas.crowdsec.net/schemas/appsec-rule.yaml"
title: "CrowdSec AppSec Rule"

# Structure of a CrowdSec AppSec (WAF) rule file.
#
# Blocks marked BEGIN/END GENERATED come from the four vocabulary maps in
# pkg/appsec/appsec_rule/modsecurity.go. Change the Go maps and re-run
# tools/sync_appsec_vocabulary.py; editing the enums here only reintroduces
# drift.
#
# The engine loads rule files with yaml.UnmarshalStrict, so any unknown field --
# including a typo such as `tranform` -- makes the whole file fail to load
# rather than being ignored. Every object below therefore sets
# additionalProperties: false, to catch that here instead of at runtime.
type: object
additionalProperties: false
properties:
  name:
    type: string
    description: |
      Unique identifier for the AppSec rule.  Names follow the
      `author/name` convention (e.g. `crowdsecurity/vpatch-CVE-2024-0001`).
  description:
    type: string
    description: |
      Free‑form description of what the rule detects.  This text
      appears in the Hub and the CrowdSec console, and becomes the
      `msg` of every generated SecRule.
  type:
    type: string
    description: |
      Hub item type marker.  Optional and rarely set by hand.
  debug:
    type: boolean
    description: |
      Raise the log level for this rule alone, which is the quickest way
      to see what the generated SecRule directives actually matched.
  severity:
    $ref: "#/$defs/severity"
  rules:
    type: array
    description: |
      A non‑empty list of conditions and/or logical groups that
      define when the rule is triggered.  Each item in the list
      can either be a leaf (matching a specific request part) or a
      composite rule using `and` or `or` to combine other
      conditions.  When multiple top‑level items are present they
      are evaluated in order and each matching item will trigger
      the rule independently.
    minItems: 1
    items:
      allOf:
        - $ref: "#/$defs/ruleItem"
        # The engine validates the top-level item only: a bare condition here
        # must carry a match value, while the same condition nested under
        # `and`/`or` may omit it (as the libinjection detectors usually do).
        - anyOf:
            - required: [and]
            - required: [or]
            - properties:
                match:
                  required: [value]
  labels:
    $ref: "#/$defs/labels"
  seclang_rules:
    type: array
    description: |
      Inline ModSecurity/Seclang rules to be loaded by the AppSec
      engine.  These are interpreted by the Coraza runtime.
    items:
      type: string
  seclang_files_rules:
    type: array
    description: |
      A list of file names containing ModSecurity/Seclang rules.  The
      referenced files must live in the CrowdSec data directory
      (e.g. `/var/lib/crowdsec/data`).  Each entry SHOULD be a
      relative file name without path traversal.
    items:
      type: string
  data:
    $ref: "#/$defs/data"
required:
  - name
anyOf:
  - required: ["rules"]
  - required: ["seclang_rules"]
  - required: ["seclang_files_rules"]
  # A rule may carry nothing but `data`: several hub rules exist only to make
  # cscli download the CRS plugin files that other rules then include.
  - required: ["data"]
$defs:
  severity:
    description: |
      Severity attached to the generated SecRule, either a named level or a
      single digit 0-7 (0 = emergency ... 7 = debug).  Mirrors
      types.ParseRuleSeverity in CrowdSec's coraza fork.  Defaults to
      `emergency` when unset.
    anyOf:
      - type: string
        enum:
          - emergency
          - alert
          - critical
          - error
          - warning
          - notice
          - info
          - debug
      - type: integer
        minimum: 0
        maximum: 7

  data:
    type: array
    description: |
      External data files required by the rule.  When installing a rule from
      the hub, `cscli` will fetch each `source_url` and store it at
      `dest_file`.  The optional `type` controls how the contents are
      parsed in memory.
    items:
      type: object
      additionalProperties: false
      properties:
        source_url:
          type: string
          format: uri
          description: |
            URL where the data file can be downloaded.
        dest_file:
          type: string
          description: |
            Local filename (within the CrowdSec data directory) where the
            downloaded file will be stored.
        type:
          type: string
          description: |
            How the downloaded file is indexed in memory, following FileInit
            in pkg/exprhelpers/helpers.go.  `modsec` and `challenge-js` are
            downloaded only — coraza and the challenge runtime read them
            straight off disk.  `regex`/`regexp` hold one RE2 expression per
            line and `string` one literal per line.
          enum:
            - modsec
            - challenge-js
            - regex
            - regexp
            - string
            - map
            - bots
        cache:
          type: boolean
          description: |
            Cache lookups against this file.  Only meaningful for the
            expression-backed types; set it to `false` to disable caching
            that `strategy`/`ttl`/`size` would otherwise turn on.
        strategy:
          type: string
          description: |
            Cache eviction strategy; anything else falls back to `LRU`.
          enum:
            - LRU
            - LFU
            - ARC
        size:
          type: integer
          minimum: 1
          description: |
            Number of cache entries to keep (default 50).
        ttl:
          type: string
          description: |
            Cache entry lifetime as a Go duration, e.g. `5m` or `1h30m`.
      required:
        - source_url
        - dest_file

  labels:
    type: object
    description: |
      A map of labels applied to the rule.  Labels are free‑form
      key/value pairs used by the Hub and console to categorise
      rules.  The following keys are commonly used:

        * `type` — high level category (e.g. `exploit`)
        * `service` — service targeted by the rule (e.g. `http`)
        * `behavior` — behaviour tag used by the remediation engine (e.g. `http:exploit`)
        * `confidence` — integer from 1 to 5 describing how confident we are in the detection
        * `spoofable` — integer (`0` or `1`) indicating if the detection can be spoofed
        * `label` — human readable summary of the rule
        * `classification` — list of reference identifiers (e.g. CVE or ATT&CK IDs)

      Additional keys MAY be present and MUST have string, number or
      boolean values.  The schema only constrains known keys and
      leaves room for extensibility.

      The `required` list below is deliberately stricter than the engine,
      which needs no labels at all: it is the bar for contributing a rule
      to the hub.
    additionalProperties:
      anyOf:
        - type: string
        - type: number
        - type: boolean
        - type: array
          items:
            type: string

    properties:
      type:
        type: string
      service:
        type: string
      behavior:
        type: string
      confidence:
        type: integer
        minimum: 0
      spoofable:
        type: integer
        minimum: 0
      label:
        type: string
      classification:
        type: array
        items:
          type: string
          description: "MITRE/ATT&CK-like tags."
      references:
        description: |
          A reference to external resources, such as CVE identifiers, blog posts
          or other documentation.  The value can be either a single string or
          an array of strings.
        anyOf:
          - type: string
          - type: array
            items:
              type: string
    required:
      - type
      - service
      - behavior
      - confidence
      - spoofable
      - classification

  ruleItem:
    type: object
    additionalProperties: false
    description: |
      One rule condition.  A condition inspects `zones` and carries a `match`,
      groups other conditions under `and`/`or`, or does both — a node that has
      `zones` alongside `and`/`or` contributes its own match as one more AND
      term.  `and` and `or` may sit on the same node; the engine flattens the
      whole tree into disjunctive normal form, capped at 50 resulting groups.
    properties:
      zones:
        type: array
        description: |
          List of zones specifying which parts of the HTTP request
          to inspect.
        minItems: 1
        items:
          type: string
          # BEGIN GENERATED zones (tools/sync_appsec_vocabulary.py)
          enum:
            - ARGS
            - ARGS_NAMES
            - BODY_ARGS
            - BODY_ARGS_NAMES
            - COOKIES
            - COOKIES_NAMES
            - FILES
            - FILES_NAMES
            - FILES_TOTAL_SIZE
            - HEADERS_NAMES
            - HEADERS
            - METHOD
            - PROTOCOL
            - URI
            - URI_FULL
            - RAW_BODY
            - FILENAMES
          # END GENERATED zones
      variables:
        type: array
        description: |
          Restricts the match to specific keys within the selected zones, so
          it only applies to keyed zones (`ARGS`, `BODY_ARGS`, `HEADERS`,
          `COOKIES` and their `_NAMES` variants).  An entry is either a literal
          key name or, when wrapped in slashes (`/pattern_.*/`), an RE2 regexp
          matched against the available key names.
        items:
          type: string
      transform:
        type: array
        description: |
          List of transformations applied sequentially on the
          target before performing the match.  Note that `count` replaces the
          target with the number of matching keys in the collection, so it
          only does something when `variables` is also set.
        items:
          type: string
          # BEGIN GENERATED transforms (tools/sync_appsec_vocabulary.py)
          enum:
            - lowercase
            - uppercase
            - length
            - trim
            - trim_left
            - trim_right
            - htmlentitydecode
            - html_entity_decode
            - js_decode
            - css_decode
            - urldecode
            - hexdecode
            - cmdline
            - b64decode
            - b64decode_lenient
            - b64encode
            - normalize_path
            - normalizepath
            - normalize_path_win
            - normalizepathwin
            - remove_whitespaces
            - compress_whitespaces
            - remove_nulls
            - replace_nulls
            - remove_comments
            - replace_comments
            - count
          # END GENERATED transforms
      body_type:
        type: string
        description: |
          Force the request body parser for this condition instead of letting
          the Content-Type decide.
        # BEGIN GENERATED body-types (tools/sync_appsec_vocabulary.py)
        enum:
          - json
          - xml
          - multipart
          - urlencoded
        # END GENERATED body-types
      severity:
        $ref: "#/$defs/severity"
      name:
        type: string
        description: |
          Optional label for this condition, used in logs and troubleshooting
          to tell apart the SecRule directives a single rule expands into.  It
          does not restrict what is matched — use `variables` for that.
      match:
        $ref: "#/$defs/match"
      and:
        type: array
        description: |
          Sub-conditions that must all match.
        minItems: 1
        items:
          $ref: "#/$defs/ruleItem"
      or:
        type: array
        description: |
          Sub-conditions of which any one matching is enough.
        minItems: 1
        items:
          $ref: "#/$defs/ruleItem"
    anyOf:
      - required: [zones]
      - required: [and]
      - required: [or]
    # A condition that names zones has to say what to look for in them, and a
    # match needs zones to read from.
    dependentRequired:
      zones: [match]
      match: [zones]

  match:
    type: object
    description: |
      Specifies how to compare the extracted target against a
      constant value.  `type` is always required; `value` is required except
      for the libinjection detectors, which take no argument.  Set
      `not: true` to negate the comparison.
    oneOf:
      # Detectors that ignore their argument.
      - type: object
        additionalProperties: false
        properties:
          type:
            type: string
            # BEGIN GENERATED match-types-valueless (tools/sync_appsec_vocabulary.py)
            enum:
              - libinjectionSQL
              - libinjectionXSS
            # END GENERATED match-types-valueless
          value:
            type: string
          not:
            type: boolean
        required:
          - type
      # String comparisons.
      - type: object
        additionalProperties: false
        properties:
          type:
            type: string
            description: |
              Method used to compare the target to the value.
            # BEGIN GENERATED match-types-string (tools/sync_appsec_vocabulary.py)
            enum:
              - regex
              - equals
              - startsWith
              - endsWith
              - contains
              - fromFile
            # END GENERATED match-types-string
          value:
            description: |
              The constant value to compare the target against. Its meaning
              depends on the selected `type`: an RE2 regular expression for
              `regex`, or the name of a datafile in the data directory for
              `fromFile`.

              Non-string types are allowed because the engine reads the raw
              scalar into a Go string, while a YAML 1.1 parser resolves an
              unquoted `off` to a boolean and `1` to an integer.  Both forms
              reach the engine as `"off"` and `"1"`, so rejecting them here
              would fail rules the engine runs happily — the linter asks for
              quotes instead.
            anyOf:
              - type: string
              - type: number
              - type: boolean
          not:
            type: boolean
        required:
          - type
          - value
      # Numeric comparisons, typically against `length` or `count`.
      - type: object
        additionalProperties: false
        properties:
          type:
            type: string
            description: |
              Method used to compare the target to the value.
            # BEGIN GENERATED match-types-numeric (tools/sync_appsec_vocabulary.py)
            enum:
              - gt
              - lt
              - gte
              - lte
              - eq
            # END GENERATED match-types-numeric
          value:
            description: |
              The number to compare the target against.  The engine reads the
              scalar straight into a string, so `value: 2` and `value: "2"`
              are equivalent.
            anyOf:
              - type: number
              - type: string
          not:
            type: boolean
        required:
          - type
          - value
